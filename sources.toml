[settings]
poll_seconds = 60
digest_time = "20:00"
top = 4
adjacent = 1
instant_threshold = 4.0
max_age_hours = 72
initial_interests = ["AI 데이터센터","반도체","기업 자금 조달","퀀트 전략"]

[weights]
company_kind = 3
topic = 2
company = 1
kind = 0.5
interest = 1.5
freshness = 1

[companies]
CoreWeave = ["코어위브","CoreWeave","CRWV"]
NVIDIA = ["엔비디아","NVIDIA","NVDA"]
[topics]
"AI 데이터센터" = ["데이터센터","데이터 센터","data center","datacenter","AI infrastructure"]
"반도체" = ["반도체","semiconductor","chipmaker","GPU"]
"기업 자금 조달" = ["자금 조달","자금조달","유상증자","회사채","전환사채","financing","fundraising","debt offering"]
"퀀트 전략" = ["퀀트","quantitative","factor investing","backtest"]

[[sources]]
id="sbs"
publisher="SBS"
adapter="rss"
url="https://news.sbs.co.kr/news/newsflashRssFeed.do?plink=RSSREADER"
lang="ko"
rule="marker"
marker='^\s*\[속보\]'
verification="최신 RSS 102건 수신, 표본 내 제목 접두 표식 0건"

[[sources]]
id="bbc"
publisher="BBC"
adapter="rss"
url="https://feeds.bbci.co.uk/news/rss.xml"
lang="en"
rule="marker"
category_markers=["breaking", "breaking news"]
marker='(?i)^\s*(?:\[breaking(?: news)?\]|breaking(?: news)?\s*[:：–—-])'
verification="RSS 36건 수신, 표본 내 표식 0건"

[[sources]]
id="sky"
publisher="Sky News"
adapter="rss"
url="https://feeds.skynews.com/feeds/rss/home.xml"
lang="en"
rule="marker"
category_markers=["breaking", "breaking news"]
marker='(?i)^\s*(?:\[breaking(?: news)?\]|breaking(?: news)?\s*[:：–—-])'
verification="RSS 6건 수신, 표본 내 표식 0건"

[[sources]]
id="wp"
publisher="The Washington Post"
adapter="imap"
lang="en"
rule="dedicated"
enabled=false
verification="설정 필요 · Breaking News Alerts 전용 구독과 라벨, 실제 발신 주소"

[[sources]]
