<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>파동 · 뉴스 인덱스</title><style>
:root{--ink:#162b26;--green:#204438;--lime:#d6fa78;--paper:#f5f6f1;--line:#d9ded4;--muted:#58665d}*{box-sizing:border-box}body{margin:0;color:var(--ink);background:var(--paper);font:16px/1.55 "Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif}button,select{font:inherit;color:inherit}button{cursor:pointer}button:focus-visible,a:focus-visible,select:focus-visible{outline:3px solid #b26c14;outline-offset:3px}button{border:0;background:none}header{height:70px;background:#fff;border-bottom:1px solid var(--line)}.wrap{width:min(1240px,92vw);margin:auto}.nav{height:100%;display:flex;align-items:center;gap:40px}.logo{display:flex;align-items:center;gap:9px;white-space:nowrap;font-weight:900;font-size:28px;letter-spacing:-2px}.wave{display:inline-flex;align-items:center;justify-content:center;gap:3px;background:var(--green);border-radius:9px;width:36px;height:36px}.wave i{width:3px;background:var(--lime);border-radius:3px}.wave i:nth-child(1),.wave i:last-child{height:9px}.wave i:nth-child(2){height:20px}.wave i:nth-child(3){height:28px}.wave i:nth-child(4){height:15px}nav{align-self:stretch;display:flex;gap:22px}nav button{padding:0 2px;color:var(--muted);font-weight:650;font-size:15px;border-bottom:3px solid transparent}nav button.active{color:var(--green);border-color:var(--green)}.stamp{margin-left:auto;color:var(--muted);font-size:14px}.hero{background:#163b30;color:white;border-radius:16px;overflow:hidden;position:relative;margin:26px 0 23px;padding:31px 38px;min-height:170px;isolation:isolate}.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#163b30 22%,transparent 68%);z-index:-1}.hero canvas{width:58%;height:100%;position:absolute;top:0;right:0;z-index:-2}.live{display:inline-flex;align-items:center;gap:7px;font:700 12px/1.2 monospace;letter-spacing:1.2px;color:var(--lime)}.live:before{content:"";width:7px;height:7px;background:currentColor;border-radius:50%}h1{margin:9px 0 5px;font-size:clamp(30px,4vw,46px);line-height:1.18;letter-spacing:-3px}.hero p{margin:7px 0 0;color:#d0e2d5;font-size:15px}main{padding-bottom:120px}.columns{display:grid;grid-template-columns:minmax(280px,.7fr) minmax(0,1.45fr);gap:20px;align-items:start}.panel{background:#fff;border:1px solid var(--line);border-radius:13px;overflow:hidden}.phead{padding:21px 24px 15px;display:flex;align-items:center;justify-content:space-between}.phead h2,.sectionTitle{font-size:22px;letter-spacing:-1.2px;margin:0}.sub{color:var(--muted);font-size:13px}.rankbody{padding:0 11px 12px}.rank{display:grid;grid-template-columns:32px 1fr auto;align-items:center;gap:9px;text-align:left;width:100%;padding:11px 14px;border-radius:7px;min-height:47px}.rank+.rank{margin-top:1px}.rank:hover{background:#f2f5ee}.rank.on{background:#dff3bc}.rank b{font:700 17px ui-monospace,monospace;color:#546754}.rank.on b{color:#24482c}.rank strong{font-weight:700;letter-spacing:-.5px}.rank small{color:#536955;font:13px ui-monospace,monospace}.detailhead{padding:22px 27px 19px;border-bottom:1px solid var(--line)}.eyeline{font-size:13px;font-weight:650;color:#52684e;display:flex;align-items:center;gap:9px}.pill{background:#ebf2e2;padding:3px 9px;border-radius:20px;color:#375833}.detailhead h2{margin:6px 0 0;letter-spacing:-1.8px;font-size:34px}.articles{padding:0 26px}.story{position:relative;padding:19px 0 17px;border-bottom:1px solid var(--line)}.story:last-child{border:0}.meta{color:var(--muted);font-size:13px;display:flex;align-items:center;gap:8px}.pub{font-weight:700;color:#325647}.meta time:before{content:"·";margin-right:8px}.story a{color:var(--ink);text-decoration:none;font-size:19px;line-height:1.48;font-weight:740;letter-spacing:-.6px;display:block;margin:5px 0}.story a:hover{text-decoration:underline;text-underline-offset:4px}.story p{font-size:15px;color:#52605a;margin:5px 0 9px;line-height:1.55}.votes{display:flex;gap:6px}.votes button,.action{border:1px solid var(--line);border-radius:6px;font-size:13px;padding:4px 9px;background:white}.votes button[aria-pressed=true]{background:#e0f3c3;border-color:#829b6a}.note{margin:12px 2px;color:var(--muted);font-size:13px}.bar{position:fixed;bottom:0;left:0;right:0;background:#192e29;color:white;z-index:5;box-shadow:0 -3px 15px #13231b18}.bar button{width:100%;display:flex;align-items:center;text-align:left;gap:14px;color:white;padding:15px 0}.burst{color:#192e29;background:var(--lime);padding:1px 9px;border-radius:4px;font-size:14px;font-weight:800;white-space:nowrap}.lineTitle{overflow:hidden;white-space:nowrap;text-overflow:ellipsis;flex:1}.bar small{white-space:nowrap}.drawer{max-height:43vh;overflow:auto}.drawer a{display:block;color:#eff6ec;padding:10px 0;text-decoration:none;border-top:1px solid #3b4a44}.controls{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:16px 24px}.controls select{padding:7px 12px;border:1px solid var(--line);border-radius:5px;background:white}.controls a{color:var(--green);font-weight:700}.more{display:block;margin:15px auto 22px;padding:7px 30px}.empty{padding:18px 25px;color:var(--muted)}[hidden]{display:none!important}
@media(max-width:700px){header{height:59px}.wrap{width:93vw}.nav{gap:20px}.logo{font-size:23px}.wave{width:31px;height:31px}nav{gap:13px}nav button{font-size:14px}.stamp{display:none}.hero{margin:15px 0;padding:22px;min-height:140px}.hero p{font-size:13px}.columns{grid-template-columns:1fr;gap:12px}.rankbody{display:flex;overflow-x:auto;padding:0 10px 12px}.rank{flex:none;width:auto;display:flex;min-height:36px;gap:7px;padding:6px 11px;background:#f1f4ed}.rank+.rank{margin:0 0 0 6px}.rank small{display:none}.phead{padding:13px 16px}.phead h2{font-size:18px}.detailhead{padding:16px 19px}.detailhead h2{font-size:27px}.articles{padding:0 17px}.story a{font-size:17px}.bar button{gap:9px}.bar small{font-size:12px}}
</style></head><body><header><div class="wrap nav"><div class="logo"><span class="wave" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span>파동</div><nav aria-label="화면"><button data-tab="rank" class="active">이슈 랭킹</button><button data-tab="feed">뉴스 피드</button><button data-tab="archive">일별 결산</button></nav><span class="stamp">뉴스 인덱스</span></div></header>
<main class="wrap"><section class="hero"><canvas id="radar" aria-hidden="true"></canvas><span class="live" id="status">RSS INDEX</span><h1 id="heroTitle">오늘의 이슈 레이더</h1><p id="heroText">뉴스 제목에서 자주 등장한 키워드와 관련 보도를 모았습니다.</p></section>
<section id="rankView" class="columns"><aside class="panel"><div class="phead"><h2>화제어 랭킹</h2><span class="sub">최근 24시간</span></div><div id="ranks" class="rankbody"></div></aside><section class="panel"><div class="detailhead"><div class="eyeline"><span class="pill" id="position">관련 기사</span><span id="count"></span></div><h2 id="keyword">불러오는 중…</h2></div><div id="stories" class="articles"></div></section></section>
<section id="feedView" class="panel" hidden><div class="phead"><h2>전체 뉴스</h2><span class="sub">최신순</span></div><div class="articles" id="feed"></div><button class="action more" id="more">기사 더 보기</button></section>
<section class="panel" id="archiveView" hidden><div class="phead"><h2>날짜별 기록</h2></div><div class="controls" id="dates"></div><div id="report" class="articles"></div></section><p class="note" id="note" role="status"></p></main>
<footer class="bar"><div class="wrap"><button id="toggle" aria-controls="drawer" aria-expanded="false"><span class="burst">속보</span><span class="lineTitle" id="breakingTitle">속보 확인 중…</span><small id="expand">펼치기 ＋</small></button><div class="drawer" id="drawer" hidden></div></div></footer>
<script>
const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),safe=u=>/^https?:\/\//i.test(u)?esc(u):'#';
let state={articles:[],topics:[],breaking:[]}, chosen='', tab='rank',limit=30,votes={},archiveDates=[],day='',version=0;
const fmt=d=>new Date(d).toLocaleString('ko-KR',{timeZone:'Asia/Seoul',month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit',hour12:false});
function art(a,interactive=true){let i=state.articles.indexOf(a),v=votes[a.url]??a.vote??0;
return '<article class="story"><div class="meta"><span class="pub">'+esc(a.source)+'</span><time>'+esc(fmt(a.date))+'</time></div><a target="_blank" rel="noopener noreferrer" href="'+safe(a.url)+'">'+esc(a.title)+'</a>'+(a.summary&&a.summary!==a.title?'<p>'+esc(a.summary)+'</p>':'')+(interactive&&i>=0?'<div class="votes">'+[[1,'👍 호감'],[-1,'👎 비호감']].map(([n,l])=>'<button data-idx="'+i+'" data-v="'+n+'" aria-pressed="'+(v===n)+'">'+l+'</button>').join('')+'</div>':'')+'</article>'}
function render(){const ts=state.topics||[],t=ts.find(x=>x.word===chosen)||ts[0];chosen=t?.word||'';
$('ranks').innerHTML=ts.map((x,i)=>'<button class="rank '+(x===t?'on':'')+'" aria-pressed="'+(x===t)+'" data-rank="'+i+'"><b>'+String(i+1).padStart(2,'0')+'</b><strong>'+esc(x.word)+'</strong><small>'+x.count+'건</small></button>').join('')||'<p class="empty">집계된 화제어가 없습니다.</p>';
$('position').textContent=t?'랭킹 '+(ts.indexOf(t)+1)+'위':'관련 기사';$('count').textContent=t?'관련 기사 '+t.count+'건':'';$('keyword').textContent=t?t.word:'관련 기사 없음';
let urls=new Set(t?.urls||[]);$('stories').innerHTML=state.articles.filter(a=>urls.has(a.url)).map(a=>art(a)).join('');
$('feed').innerHTML=state.articles.slice(0,limit).map(a=>art(a)).join('');$('more').hidden=limit>=state.articles.length;
const b=state.breaking||[];$('breakingTitle').textContent=b[0]?.title||'현재 수집된 속보가 없습니다.';$('drawer').innerHTML=b.length?b.map(a=>'<a target="_blank" rel="noopener noreferrer" href="'+safe(a.url)+'">'+esc(a.source)+' · '+esc(a.title)+'</a>').join(''):'<p>매체가 속보로 표시한 기사가 들어오면 이곳에 표시됩니다.</p>';
if(state.asof){$('status').textContent=state.snapshot?'RSS SNAPSHOT':'RSS LIVE';$('note').textContent='한국시간 '+fmt(state.asof)+' 기준 · '+(state.snapshot?'저장된 RSS 수집본':'최근 수집 자료')+' · 화제어 순위는 제목에 해당 단어가 등장한 기사 수로 집계합니다.'}}
async function load(){try{const r=await fetch('/api/live');if(!r.ok)throw Error();state=await r.json();if(state.voting)votes={};render()}catch{$('note').textContent='뉴스를 갱신하지 못했습니다. 잠시 후 자동으로 재시도합니다.'}}
async function archive(){const rev=++version;try{const r=await fetch('/api/archive');if(!r.ok)throw Error();archiveDates=await r.json();if(rev!==version)return;if(!archiveDates.length){$('report').textContent='아직 저장된 결산이 없습니다.';return}day=archiveDates.includes(day)?day:archiveDates[0];showDay()}catch{$('report').textContent='결산 목록을 불러오지 못했습니다.'}}
async function showDay(){const rev=++version;const p=day.split('-');$('dates').innerHTML=['년','월','일'].map((s,i)=>{let opts=[...new Set(archiveDates.filter(d=>p.slice(0,i).every((v,j)=>d.split('-')[j]===v)).map(d=>d.split('-')[i]))];return '<select aria-label="'+s+'" data-part="'+i+'">'+opts.map(v=>'<option '+(v===p[i]?'selected':'')+' value="'+v+'">'+v+s+'</option>').join('')+'</select>'}).join('');const path='/archive/'+p.join('/')+'.json';$('dates').insertAdjacentHTML('beforeend','<a download href="'+path+'">JSON 내려받기</a>');$('report').textContent='결산을 불러오는 중…';try{const r=await fetch(path);if(!r.ok)throw Error();const d=await r.json();if(rev!==version)return;const a=(d.articles||[]).map(a=>a.date?a:{...a,date:a.published,source:a.publisher||a.source,title:a.korean_title||a.title,url:(a.urls||[])[0]||''});const words=(d.keywords||Object.keys(d.topics||{})).slice(0,5).map(t=>typeof t==='string'?t:t.word).filter(Boolean);$('report').innerHTML='<h3>'+esc(day)+' · 기사 '+a.length+'건</h3>'+(words.length?'<p>주요 화제어 · '+esc(words.join(' · '))+'</p>':'')+a.map(x=>art(x,false)).join('')}catch{if(rev===version)$('report').textContent='결산 파일을 불러오지 못했습니다.'}}
$('dates').onchange=e=>{let i=Number(e.target.dataset.part),p=day.split('-');p[i]=e.target.value;day=archiveDates.find(d=>d.startsWith(p.slice(0,i+1).join('-')));showDay()};
document.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.tab){tab=b.dataset.tab;for(const t of ['rank','feed','archive'])$(t+'View').hidden=t!==tab;document.querySelectorAll('[data-tab]').forEach(n=>n.classList.toggle('active',n===b));$('heroTitle').textContent={rank:'오늘의 이슈 레이더',feed:'시간순 뉴스 피드',archive:'일별 뉴스 결산'}[tab];$('heroText').textContent={rank:'뉴스 제목에서 자주 등장한 키워드와 관련 보도를 모았습니다.',feed:'새로 들어온 기사를 읽고, 기사마다 호감과 비호감을 남겨 보세요.',archive:'날짜를 선택해 그날의 뉴스와 화제어 기록을 확인하세요.'}[tab];if(tab==='archive')archive()}
if(b.dataset.rank!==undefined){chosen=state.topics[Number(b.dataset.rank)].word;render();document.querySelector('[data-rank="'+b.dataset.rank+'"]').focus({preventScroll:true})}
if(b.dataset.v){const a=state.articles[Number(b.dataset.idx)],old=votes[a.url]??a.vote??0,value=old===Number(b.dataset.v)?0:Number(b.dataset.v);b.parentElement.querySelectorAll('button').forEach(n=>n.disabled=true);try{const r=await fetch('/api/vote',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url:a.url,id:a.id,value})});if(!r.ok)throw Error();votes[a.url]=(await r.json()).value;render()}catch{render();$('note').textContent='평가를 저장하지 못했습니다. 다시 시도해 주세요.'}}
if(b.id==='more'){limit+=30;render()}if(b.id==='toggle'){const open=$('drawer').hidden;$('drawer').hidden=!open;b.setAttribute('aria-expanded',open);$('expand').textContent=open?'접기 −':'펼치기 ＋'}});
function paint(){const c=$('radar'),w=c.clientWidth,h=c.clientHeight,d=devicePixelRatio||1;c.width=w*d;c.height=h*d;const g=c.getContext('2d');g.scale(d,d);const x=w*.65,y=h*.6;g.lineWidth=1;g.strokeStyle='#3c6152';for(let n=-320;n<w+350;n+=23){g.beginPath();g.moveTo(n,0);g.lineTo(n,h);g.stroke()}for(let n=0;n<h;n+=23){g.beginPath();g.moveTo(0,n);g.lineTo(w,n);g.stroke()}for(let r=26;r<330;r+=32){g.strokeStyle=r===90?'#b9dc77':'#71967b';g.beginPath();g.arc(x,y,r,0,2*Math.PI);g.stroke()}let a=-.54;g.fillStyle='#d7fb7824';g.beginPath();g.moveTo(x,y);g.arc(x,y,250,a-.42,a);g.closePath();g.fill();g.strokeStyle='#d6fa78';g.beginPath();g.moveTo(x,y);g.lineTo(x+Math.cos(a)*260,y+Math.sin(a)*260);g.stroke();for(const [dx,dy] of [[0,0],[69,-53],[-82,32],[124,21],[-37,-65]]){g.fillStyle='#d6fa78';g.beginPath();g.arc(x+dx,y+dy,4,0,7);g.fill();g.strokeStyle='#d6fa7877';g.beginPath();g.arc(x+dx,y+dy,9,0,7);g.stroke()}}
if(window.initialNews){state=window.initialNews;render()}paint();window.addEventListener('resize',paint);load();fetch('/api/votes').then(r=>r.ok?r.json():{}).then(x=>{votes=x;render()}).catch(()=>{});setInterval(load,60000);
</script></body></html>
